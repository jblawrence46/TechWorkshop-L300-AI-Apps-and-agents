name: Deploy to Azure Container Registry

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/deploy-to-acr.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Create .env file for build
        run: |
          echo "${{ secrets.ENV }}" > src/.env
          # Ensure .env exists only during build
          ls -la src/.env

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/mk7ts6jo7jwascosureg:latest \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/mk7ts6jo7jwascosureg:${{ github.sha }} \
            ./src

      - name: Push Docker image to ACR
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/mk7ts6jo7jwascosureg:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/mk7ts6jo7jwascosureg:${{ github.sha }}

      - name: Cleanup .env file
        if: always()
        run: |
          rm -f src/.env
          echo "Cleaned up .env file"
