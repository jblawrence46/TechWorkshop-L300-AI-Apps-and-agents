name: Deploy Customer Loyalty Agent

on:
  push:
    paths:
      - "src/app/agents/customerLoyaltyAgent_initializer.py"
      - "src/prompts/CustomerLoyaltyAgentPrompt.txt"
      - "src/app/tools/discountLogic.py"
  workflow_dispatch:

jobs:
  deploy-customer-loyalty-agent:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            src/requirements.txt

      # Workshop pattern: store the JSON output of az ad sp create-for-rbac as AZURE_CREDENTIALS [1](https://microsoft.github.io/TechWorkshop-L300-AI-Apps-and-agents/docs/05_agentic_devops/05_02.html)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          # Safety net in case your requirements.txt doesn't include it yet:
          pip show azure-ai-projects >/dev/null 2>&1 || pip install azure-ai-projects

      - name: Run Customer Loyalty Agent initializer
        env:
          # azure-ai-projects commonly needs a Foundry Project endpoint URL (set as a GitHub Secret) [2](https://pypi.org/project/azure-ai-projects/)
          PROJECT_ENDPOINT: ${{ secrets.PROJECT_ENDPOINT }}

          # Make src importable for "src/app/..." modules
          PYTHONPATH: ${{ github.workspace }}/src

          # OPTIONAL: If your initializer expects other settings (keep these as secrets if used)
          # AZURE_AI_PROJECT_NAME: ${{ secrets.AZURE_AI_PROJECT_NAME }}
          # AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          # AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        run: |
          python src/app/agents/customerLoyaltyAgent_initializer.py
